<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111318">
  <meta name="description" content="Rhythm Lab ドラムフィル専用ページ">
  <title>ドラムのおかず | Rhythm Lab</title>
  <link rel="stylesheet" href="style.css?v=16">
  <link rel="stylesheet" href="mobile.css?v=16">
  <link rel="stylesheet" href="rhythm-picker.css?v=16">
  <link rel="stylesheet" href="performance.css?v=16">
  <link rel="stylesheet" href="drum-fills.css?v=16">
  <style>
    .fills-page-header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}.fills-page-header h1{font-size:clamp(2rem,5vw,4rem)}.back-link{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 16px;border-radius:14px;background:#1c2028;color:#fff;text-decoration:none;font-weight:800}.fills-intro{padding:20px 24px;margin-bottom:14px}.fills-intro p{margin:6px 0 0;color:var(--muted);line-height:1.7}.fill-base-picker{padding:18px;margin-bottom:14px}.fill-base-picker .two-stage-picker{margin-top:12px}.hidden-support{display:none!important}@media(max-width:520px){.fills-page-header{align-items:flex-start}.back-link{min-height:42px;padding:0 12px;font-size:.82rem}.fills-intro{padding:16px}}
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="fills-page-header">
      <div><p class="eyebrow">DRUM FILL LAB</p><h1>ドラムのおかず</h1></div>
      <a class="back-link" href="index.html">← Rhythm Labへ戻る</a>
    </header>
    <main>
      <section class="panel fills-intro"><span class="section-kicker">HOW TO USE</span><h2>フィルインだけを集中して学ぶ</h2><p>ジャンル・長さ・難易度から選び、試聴して配置を確認できるよ。気に入ったフィルは下のシーケンサーで自由に編集できる。</p></section>
      <section class="panel primary-controls" aria-label="基本操作"><div class="transport-main"><button id="playButton" class="play-button" type="button" aria-label="再生"><span class="play-icon">▶</span><span class="stop-icon">■</span></button><button id="clearButton" class="secondary-button" type="button">クリア</button><button id="saveButton" class="secondary-button" type="button">保存</button></div><label class="control-group bpm-control"><span>BPM <strong id="bpmValue">100</strong></span><input id="bpmInput" type="range" min="50" max="220" value="100"></label><label class="control-group swing-control"><span>スウィング <strong id="swingValue">0%</strong></span><input id="swingInput" type="range" min="0" max="45" value="0"></label></section>
      <section class="panel fill-base-picker"><div class="picker-title"><span class="section-kicker">BASE RHYTHM</span><strong>土台にするリズム</strong></div><div class="two-stage-picker"><label class="picker-field"><span class="picker-number">1</span><span class="picker-label">ジャンル</span><select id="categorySelect"><option value="all">すべて</option></select></label><span class="picker-arrow">→</span><label class="picker-field rhythm-field"><span class="picker-number">2</span><span class="picker-label">リズム</span><select id="presetSelect"></select></label><button id="favoriteButton" class="favorite-button" type="button">☆</button></div><input id="presetSearch" type="hidden" value=""></section>
      <section class="lesson-strip panel compact-lesson" aria-live="polite"><div class="lesson-main"><span class="lesson-label">いまのフィル</span><h2 id="lessonTitle">フィルを選ぼう</h2><p id="lessonText">下の一覧から試聴または追加してね。</p><div id="lessonTags" class="lesson-tags"></div></div><div class="count-display"><span id="beatCount">1</span><small id="subdivisionCount">e</small></div></section>
      <section class="sequencer-panel panel" aria-label="フィルシーケンサー"><div class="sequencer-toolbar"><strong id="kitSummary">24 INSTRUMENTS</strong><span>横にスクロール</span></div><div id="timeline" class="timeline"></div><div id="sequencer" class="sequencer"></div></section>
      <details class="panel advanced-panel"><summary>音色・演奏表現</summary><div class="advanced-grid"><label class="control-group volume-control"><span>音量 <strong id="volumeValue">80%</strong></span><input id="volumeInput" type="range" min="0" max="100" value="80"></label><label class="select-control"><span>ステップ</span><select id="stepCountSelect"><option value="4">4</option><option value="8">8</option><option value="16" selected>16</option><option value="32">32</option></select></label><label class="select-control"><span>拍子</span><select id="meterSelect"><option value="4/4">4/4</option><option value="3/4">3/4</option><option value="6/8">6/8</option><option value="5/4">5/4</option><option value="7/8">7/8</option></select></label><label class="toggle-control"><input id="metronomeInput" type="checkbox"><span>メトロノーム</span></label></div><div class="performance-controls"><div class="expression-modes"><button class="expression-button is-selected" data-expression-mode="normal">通常<span>Normal</span></button><button class="expression-button" data-expression-mode="accent">アクセント<span>強く</span></button><button class="expression-button" data-expression-mode="ghost">ゴースト<span>弱く</span></button><button class="expression-button" data-expression-mode="flam">フラム<span>2打</span></button><button class="expression-button" data-expression-mode="roll">ロール<span>連打</span></button></div><div class="performance-grid"><label class="control-group"><span>ベロシティ <strong id="velocityValue">100</strong></span><input id="velocityInput" type="range" min="20" max="127" value="100"></label><label class="control-group"><span>Humanize <strong id="humanizeValue">0%</strong></span><input id="humanizeInput" type="range" min="0" max="100" value="0"></label><label class="select-control"><span>ドラムキット</span><select id="drumKitSelect"><option value="studio">Studio</option><option value="electronic">Electronic</option><option value="vintage">Vintage</option><option value="lofi">Lo-Fi</option></select></label></div></div></details>
      <div class="hidden-support"><span id="rhythmLibrary"></span><div id="presetCards"></div><span id="featureText"></span><span id="roleText"></span><span id="practiceText"></span></div>
    </main>
  </div>
  <dialog id="helpDialog"><div class="dialog-content"><button id="closeHelpButton" class="dialog-close">×</button><h2>使い方</h2><ol><li>土台のリズムを選ぶ</li><li>フィルを試聴する</li><li>置き換え・重ねるを選ぶ</li><li>シーケンサーで編集する</li></ol></div></dialog>
  <button id="helpButton" class="hidden-support"></button>
  <script src="app.js?v=16"></script><script src="more-presets.js?v=16"></script><script src="expressive-presets.js?v=16"></script><script src="performance.js?v=16"></script><script src="drum-fills.js?v=16"></script>
</body>
</html>
